<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vendor Dashboard – 8.8 Events</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        .dashboard-layout { display: grid; grid-template-columns: 250px 1fr; min-height: 100vh; }
        .sidebar { background: var(--dark-2); padding: 2rem 1.5rem; border-right: 1px solid rgba(255,255,255,0.06); }
        .main-content { padding: 3rem; background: var(--dark); }
        
        .user-info { margin-bottom: 2rem; padding-bottom: 2rem; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .user-info h3 { font-family: var(--font-heading); color: var(--gold); }
        
        .sidebar-nav { list-style: none; display: flex; flex-direction: column; gap: 1rem; }
        .sidebar-nav a { color: var(--white-70); text-decoration: none; font-size: 0.95rem; transition: color 0.3s; }
        .sidebar-nav a:hover, .sidebar-nav a.active { color: var(--white); font-weight: 500; }
        
        .stat-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.5rem; margin-bottom: 3rem; }
        .stat-card { background: var(--dark-card); padding: 1.5rem; border-radius: 8px; border: 1px solid rgba(255,255,255,0.06); }
        .stat-card h4 { font-size: 0.8rem; color: var(--white-40); text-transform: uppercase; letter-spacing: 1px; }
        .stat-card .val { font-size: 2rem; font-family: var(--font-heading); font-weight: 700; color: var(--gold); margin-top: 0.5rem; }

        .requests-list { background: var(--dark-card); border-radius: 8px; border: 1px solid rgba(255,255,255,0.06); padding: 2rem; }
        .request-item { padding: 1.5rem; border-bottom: 1px solid rgba(255,255,255,0.06); display: flex; justify-content: space-between; align-items: center; }
        .request-item:last-child { border-bottom: none; }
        .req-info h4 { font-family: var(--font-heading); font-size: 1.2rem; }
        .req-info p { font-size: 0.9rem; color: var(--white-70); margin-top: 0.3rem; }
        .req-actions { display: flex; gap: 0.8rem; }
        .btn-small { padding: 0.5rem 1rem; font-size: 0.8rem; }
        .btn-green { background: #10B981; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .btn-red { background: #EF4444; color: white; border: none; border-radius: 4px; cursor: pointer; }

        .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
        .logout-btn { background: transparent; border: 1px solid rgba(255,255,255,0.4); color: white; padding: 0.5rem 1rem; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="dashboard-layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <a href="index.html" style="display:block; margin-bottom: 3rem;"><img src="images/logo1.jpg" alt="8.8 Events" style="height: 40px;"></a>
            
            <div class="user-info">
                <h3 id="vendor-name">Welcome</h3>
                <p style="font-size: 0.8rem; color: var(--white-40);" id="vendor-category">Service Category</p>
                <span style="display:inline-block; margin-top: 0.5rem; font-size: 0.7rem; padding: 0.2rem 0.6rem; background: rgba(201,168,76,0.1); color: var(--gold); border: 1px solid var(--gold); border-radius: 12px;">Verified Vendor</span>
            </div>

            <ul class="sidebar-nav">
                <li><a href="#" class="active">Dashboard</a></li>
                <li><a href="#">My Profile</a></li>
                <li><a href="#">Service Requests</a></li>
                <li><a href="#">Payments</a></li>
                <li><a href="#">Settings</a></li>
            </ul>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="header-top">
                <h2 style="font-family: var(--font-heading); font-size: 2.2rem;">Dashboard</h2>
                <button class="logout-btn" onclick="logout()">Log Out</button>
            </div>

            <div class="stat-cards">
                <div class="stat-card">
                    <h4>New Requests</h4>
                    <div class="val" id="stat-requests">0</div>
                </div>
                <div class="stat-card">
                    <h4>Completed Jobs</h4>
                    <div class="val">0</div>
                </div>
                <div class="stat-card">
                    <h4>Profile Views</h4>
                    <div class="val">24</div>
                </div>
            </div>

            <div class="requests-list">
                <h3 style="font-family: var(--font-heading); font-size: 1.5rem; margin-bottom: 1.5rem;">Incoming Requests</h3>
                <div id="requests-container">
                    <!-- Requests will be injected here via JS -->
                    <p style="color: var(--white-40);">No incoming requests yet.</p>
                </div>
            </div>
        </main>
    </div>

    <script>
        function checkAuth() {
            const currentUser = JSON.parse(localStorage.getItem('currentUser'));
            if (!currentUser || currentUser.type !== 'vendor') {
                window.location.href = 'register.html';
                return null;
            }
            return currentUser;
        }

        function loadDashboard() {
            const vendor = checkAuth();
            if (!vendor) return;

            document.getElementById('vendor-name').innerText = `Hi, ${vendor.firstName}`;
            document.getElementById('vendor-category').innerText = vendor.category || 'Vendor';

            const allRequests = JSON.parse(localStorage.getItem('requests') || '[]');
            const myRequests = allRequests.filter(req => req.vendorId === vendor.id);

            document.getElementById('stat-requests').innerText = myRequests.length;

            const container = document.getElementById('requests-container');
            if (myRequests.length > 0) {
                container.innerHTML = '';
                myRequests.forEach((req, index) => {
                    const item = document.createElement('div');
                    item.className = 'request-item';
                    item.innerHTML = `
                        <div class="req-info">
                            <h4>Request from ${req.clientName}</h4>
                            <p><strong>Date:</strong> ${req.date} | <strong>Location:</strong> ${req.location}</p>
                            <p style="font-size: 0.8rem; margin-top:0.5rem; color:var(--white-40)">"${req.details}"</p>
                        </div>
                        <div class="req-actions">
                            ${req.status === 'pending' ? `
                                <button class="btn-green btn-small" onclick="updateReqStatus(${index}, 'accepted')">Accept</button>
                                <button class="btn-red btn-small" onclick="updateReqStatus(${index}, 'declined')">Decline</button>
                            ` : `<span style="color: var(--gold); font-size: 0.85rem; font-weight:600; text-transform:uppercase;">${req.status}</span>`}
                        </div>
                    `;
                    container.appendChild(item);
                });
            }
        }

        function updateReqStatus(index, status) {
            const vendor = checkAuth();
            if (!vendor) return;

            const allRequests = JSON.parse(localStorage.getItem('requests') || '[]');
            const myRequests = allRequests.filter(req => req.vendorId === vendor.id);
            
            if(myRequests[index]) {
                const reqId = myRequests[index].reqId;
                const globalIndex = allRequests.findIndex(r => r.reqId === reqId);
                if(globalIndex !== -1) {
                    allRequests[globalIndex].status = status;
                    localStorage.setItem('requests', JSON.stringify(allRequests));
                    loadDashboard();
                }
            }
        }

        function logout() {
            localStorage.removeItem('currentUser');
            window.location.href = 'index.html';
        }

        window.onload = loadDashboard;
    </script>
</body>
</html>
