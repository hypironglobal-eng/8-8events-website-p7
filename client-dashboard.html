<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client Dashboard – 8.8 Events</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        .dashboard-layout { display: grid; grid-template-columns: 250px 1fr; min-height: 100vh; }
        .sidebar { background: var(--dark-2); padding: 2rem 1.5rem; border-right: 1px solid rgba(255,255,255,0.06); }
        .main-content { padding: 3rem; background: var(--dark); }
        
        .user-info { margin-bottom: 2rem; padding-bottom: 2rem; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .user-info h3 { font-family: var(--font-heading); color: var(--gold); }
        
        .sidebar-nav { list-style: none; display: flex; flex-direction: column; gap: 1rem; }
        .sidebar-nav a { color: var(--white-70); text-decoration: none; font-size: 0.95rem; transition: color 0.3s; }
        .sidebar-nav a:hover, .sidebar-nav a.active { color: var(--white); font-weight: 500; }
        
        .requests-list { background: var(--dark-card); border-radius: 8px; border: 1px solid rgba(255,255,255,0.06); padding: 2rem; }
        .request-item { padding: 1.5rem; border-bottom: 1px solid rgba(255,255,255,0.06); display: flex; justify-content: space-between; align-items: center; }
        .request-item:last-child { border-bottom: none; }
        .req-info h4 { font-family: var(--font-heading); font-size: 1.2rem; }
        .req-info p { font-size: 0.9rem; color: var(--white-70); margin-top: 0.3rem; }
        .req-status { font-size: 0.85rem; font-weight: 600; text-transform: uppercase; padding: 0.3rem 0.8rem; border-radius: 4px; }
        
        .status-pending { background: rgba(255,255,255,0.1); color: white; }
        .status-accepted { background: rgba(16, 185, 129, 0.2); color: #10B981; }
        .status-declined { background: rgba(239, 68, 68, 0.2); color: #EF4444; }

        .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
        .logout-btn { background: transparent; border: 1px solid rgba(255,255,255,0.4); color: white; padding: 0.5rem 1rem; border-radius: 4px; cursor: pointer; }
        .btn-gold-small { background: linear-gradient(135deg, var(--gold), var(--gold-light)); color: var(--dark); padding: 0.5rem 1rem; border-radius: 4px; text-decoration: none; font-weight: 600; font-size: 0.8rem; display: inline-block; }
    </style>
</head>
<body>
    <div class="dashboard-layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <a href="index.html" style="display:block; margin-bottom: 3rem;"><img src="images/logo1.jpg" alt="8.8 Events" style="height: 40px;"></a>
            
            <div class="user-info">
                <h3 id="client-name">Welcome</h3>
                <p style="font-size: 0.8rem; color: var(--white-40);">Client Account</p>
            </div>

            <ul class="sidebar-nav">
                <li><a href="#" class="active">Dashboard</a></li>
                <li><a href="#">My Profile</a></li>
                <li><a href="#">My Requests</a></li>
                <li><a href="#">Saved Vendors</a></li>
                <li><a href="#">Settings</a></li>
            </ul>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="header-top">
                <h2 style="font-family: var(--font-heading); font-size: 2.2rem;">Dashboard</h2>
                <div>
                    <a href="search.html" class="btn-gold-small" style="margin-right: 1rem;">Find Vendors</a>
                    <button class="logout-btn" onclick="logout()">Log Out</button>
                </div>
            </div>

            <div class="requests-list">
                <h3 style="font-family: var(--font-heading); font-size: 1.5rem; margin-bottom: 1.5rem;">My Sent Requests</h3>
                <div id="requests-container">
                    <p style="color: var(--white-40);">You haven't sent any requests yet. <a href="search.html" style="color:var(--gold);">Find vendors</a> to get started.</p>
                </div>
            </div>
        </main>
    </div>

    <script>
        function checkAuth() {
            const currentUser = JSON.parse(localStorage.getItem('currentUser'));
            if (!currentUser || currentUser.type !== 'client') {
                window.location.href = 'client-register.html';
                return null;
            }
            return currentUser;
        }

        function loadDashboard() {
            const client = checkAuth();
            if (!client) return;

            document.getElementById('client-name').innerText = `Hi, ${client.firstName}`;

            const allRequests = JSON.parse(localStorage.getItem('requests') || '[]');
            const myRequests = allRequests.filter(req => req.clientId === client.id);

            const container = document.getElementById('requests-container');
            if (myRequests.length > 0) {
                container.innerHTML = '';
                myRequests.forEach(req => {
                    const item = document.createElement('div');
                    item.className = 'request-item';
                    
                    let statusClass = 'status-pending';
                    if(req.status === 'accepted') statusClass = 'status-accepted';
                    if(req.status === 'declined') statusClass = 'status-declined';

                    item.innerHTML = `
                        <div class="req-info">
                            <h4>Request to ${req.vendorName || 'Vendor'}</h4>
                            <p><strong>Date:</strong> ${req.date} | <strong>Location:</strong> ${req.location}</p>
                            <p style="font-size: 0.8rem; margin-top:0.5rem; color:var(--white-40)">"${req.details}"</p>
                        </div>
                        <div>
                            <span class="req-status ${statusClass}">${req.status}</span>
                        </div>
                    `;
                    container.appendChild(item);
                });
            }
        }

        function logout() {
            localStorage.removeItem('currentUser');
            window.location.href = 'index.html';
        }

        window.onload = loadDashboard;
    </script>
</body>
</html>
